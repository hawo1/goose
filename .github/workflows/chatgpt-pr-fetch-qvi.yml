name: ChatGPT PR fetch qvI-TY2W1RM
on:
  pull_request:
    paths: [chatgpt-qvi-trigger.txt]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp youtube-transcript-api
      - name: Retrieve transcript
        shell: bash
        run: |
          set +e
          mkdir -p transcript-output
          exec > >(tee transcript-output/run.log) 2>&1
          URL='https://www.youtube.com/watch?v=qvI-TY2W1RM'
          yt-dlp --no-playlist --ignore-no-formats-error --skip-download --write-info-json \
            --write-subs --write-auto-subs --sub-langs 'de.*,en.*,es.*' --sub-format 'vtt/json3/best' \
            --extractor-args 'youtube:player_client=web,web_safari,android_vr,ios,android,mweb,tv' \
            -o 'transcript-output/%(id)s.%(ext)s' "$URL" || true
          python - <<'PY'
          import json,pathlib,traceback
          out=pathlib.Path('transcript-output')
          try:
              from youtube_transcript_api import YouTubeTranscriptApi
              api=YouTubeTranscriptApi(); ts=list(api.list('qvI-TY2W1RM'))
              pref=['de','de-DE','en','en-US','es']
              def rank(t):
                  try:r=pref.index(t.language_code)
                  except ValueError:r=50
                  return (r,t.is_generated)
              t=sorted(ts,key=rank)[0]; rows=[{'text':s.text,'start':float(s.start),'duration':float(s.duration)} for s in t.fetch()]
              (out/'api-transcript.json').write_text(json.dumps({'language':t.language,'language_code':t.language_code,'segments':rows},ensure_ascii=False,indent=2),encoding='utf-8')
              (out/'api-transcript.txt').write_text('\n'.join(x['text'] for x in rows),encoding='utf-8')
          except Exception:
              (out/'api-error.txt').write_text(traceback.format_exc(),encoding='utf-8')
          PY
          find transcript-output -type f -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qvi-transcript
          path: transcript-output
          retention-days: 1
